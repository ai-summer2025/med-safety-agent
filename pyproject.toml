[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "medsafe"
version = "1.1.0"
description = "Medication safety review for care transitions: interactions, Beers, renal dosing, anticholinergic burden, allergies and reconciliation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyjwt[crypto]>=2.8"]
dev = ["pytest>=7", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyjwt[crypto]>=2.8"]

[project.scripts]
medsafe = "medsafe.cli:main"
medsafe-cds = "medsafe.cds.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"medsafe.fhir" = ["*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
per-file-ignores = { "src/medsafe/knowledge/rules.py" = ["E501"] }
